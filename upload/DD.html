<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMCore ERP — Dynamic Register & Form Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ========== CSS VARIABLES & THEMES ========== */
:root {
  --font-display: 'Space Grotesk', sans-serif;
  --font-ui: 'DM Sans', sans-serif;
  --sidebar-w: 264px;
  --sidebar-collapsed-w: 60px;
  --toolbar-h: 52px;
  --tabbar-h: 40px;
  --statusbar-h: 30px;
  --radius: 8px;
  --radius-sm: 5px;
  --radius-lg: 12px;
  --transition: 0.25s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg-primary: #0B1121;
  --bg-secondary: #0F1729;
  --bg-card: #141E33;
  --bg-elevated: #1A2740;
  --bg-hover: #1E2D48;
  --bg-active: #243652;
  --bg-input: #111B2E;
  --border: #1E2D45;
  --border-light: #253654;
  --text-primary: #E8EDF5;
  --text-secondary: #94A3B8;
  --text-muted: #5A6B82;
  --accent: #00D4AA;
  --accent-hover: #00F0C0;
  --accent-dim: rgba(0,212,170,0.12);
  --accent-border: rgba(0,212,170,0.3);
  --danger: #EF4444;
  --warning: #F59E0B;
  --success: #10B981;
  --info: #06B6D4;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --scrollbar-track: #0F1729;
  --scrollbar-thumb: #253654;
  --grid-row-alt: rgba(255,255,255,0.015);
  --grid-row-hover: rgba(0,212,170,0.06);
  --grid-row-selected: rgba(0,212,170,0.1);
}
[data-theme="light"] {
  --bg-primary: #F0F3F7;
  --bg-secondary: #E4E9F0;
  --bg-card: #FFFFFF;
  --bg-elevated: #FFFFFF;
  --bg-hover: #E8ECF2;
  --bg-active: #DCE2EB;
  --bg-input: #F5F7FA;
  --border: #D1D9E6;
  --border-light: #E2E8F0;
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #94A3B8;
  --accent: #009975;
  --accent-hover: #00B88A;
  --accent-dim: rgba(0,153,117,0.08);
  --accent-border: rgba(0,153,117,0.25);
  --danger: #DC2626;
  --warning: #D97706;
  --success: #059669;
  --info: #0891B2;
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
  --scrollbar-track: #E4E9F0;
  --scrollbar-thumb: #C1C9D6;
  --grid-row-alt: rgba(0,0,0,0.018);
  --grid-row-hover: rgba(0,153,117,0.06);
  --grid-row-selected: rgba(0,153,117,0.1);
}
/* ========== RESET & BASE ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-ui);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 13.5px;
  line-height: 1.5;
  transition: background-color var(--transition), color var(--transition);
}
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: var(--scrollbar-track); }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
input, select, textarea, button { font-family: inherit; font-size: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ========== APP LAYOUT ========== */
#app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

/* ========== SIDEBAR ========== */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  height: 100vh;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: width var(--transition), min-width var(--transition), background-color var(--transition), border-color var(--transition);
  z-index: 100;
  position: relative;
}
#sidebar.collapsed { width: var(--sidebar-collapsed-w); min-width: var(--sidebar-collapsed-w); }
#sidebar.collapsed .sidebar-text { display: none; }
#sidebar.collapsed .sidebar-search-box { display: none; }
#sidebar.collapsed .tree-children { display: none !important; }
#sidebar.collapsed .tree-item { justify-content: center; padding: 0 0; }
#sidebar.collapsed .tree-item i.tree-icon { margin-right: 0; font-size: 16px; }
#sidebar.collapsed .tree-toggle { display: none; }
#sidebar.collapsed .sidebar-header-title { display: none; }

.sidebar-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  min-height: 52px;
}
.sidebar-logo {
  width: 30px; height: 30px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent), #00A080);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
  color: #fff; flex-shrink: 0;
}
.sidebar-header-title {
  font-family: var(--font-display); font-weight: 600; font-size: 15px;
  color: var(--text-primary); white-space: nowrap;
}
.sidebar-search { padding: 10px 12px; }
.sidebar-search-box {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 6px 10px;
  transition: border-color var(--transition);
}
.sidebar-search-box:focus-within { border-color: var(--accent-border); }
.sidebar-search-box i { color: var(--text-muted); font-size: 12px; }
.sidebar-search-box input {
  border: none; background: transparent; outline: none; width: 100%;
  color: var(--text-primary); font-size: 12.5px;
}
.sidebar-search-box input::placeholder { color: var(--text-muted); }

.sidebar-tree {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 0;
}
.tree-item {
  display: flex; align-items: center; gap: 2px;
  padding: 5px 12px 5px 0; cursor: pointer; border-radius: 0;
  color: var(--text-secondary); transition: all 0.15s;
  white-space: nowrap; position: relative; user-select: none;
  min-height: 32px;
}
.tree-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.tree-item.active { background: var(--accent-dim); color: var(--accent); }
.tree-item.active::before {
  content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 3px; background: var(--accent); border-radius: 0 3px 3px 0;
}
.tree-icon { width: 28px; text-align: center; font-size: 13px; flex-shrink: 0; margin-right: 4px; }
.tree-toggle {
  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--text-muted); flex-shrink: 0; transition: transform 0.2s;
  border-radius: 3px;
}
.tree-toggle.open { transform: rotate(90deg); }
.tree-toggle:hover { background: var(--bg-active); }
.tree-children { overflow: hidden; }
.tree-children.hidden { display: none; }
.tree-badge {
  margin-left: auto; background: var(--accent-dim); color: var(--accent);
  font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600;
}
.sidebar-footer {
  padding: 10px 12px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.sidebar-footer button {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-input); color: var(--text-secondary); cursor: pointer;
  transition: all 0.15s; font-size: 12px;
}
.sidebar-footer button:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-light); }

/* ========== MAIN AREA ========== */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

/* ========== TOP TOOLBAR ========== */
#toolbar {
  height: var(--toolbar-h); min-height: var(--toolbar-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
  transition: background-color var(--transition), border-color var(--transition);
}
.toolbar-left { display: flex; align-items: center; gap: 10px; }
.toolbar-center { flex: 1; max-width: 480px; margin: 0 auto; }
.toolbar-right { display: flex; align-items: center; gap: 4px; }
.tb-btn {
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  border: none; background: transparent; color: var(--text-secondary);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all 0.15s; position: relative;
}
.tb-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.tb-btn.active { color: var(--accent); background: var(--accent-dim); }
.tb-btn .badge-dot {
  position: absolute; top: 5px; right: 5px; width: 7px; height: 7px;
  background: var(--danger); border-radius: 50%; border: 1.5px solid var(--bg-secondary);
}
.tb-search {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0 12px; height: 34px;
  transition: border-color var(--transition);
}
.tb-search:focus-within { border-color: var(--accent-border); }
.tb-search i { color: var(--text-muted); font-size: 13px; }
.tb-search input {
  border: none; background: transparent; outline: none; width: 100%;
  color: var(--text-primary); font-size: 13px;
}
.tb-search input::placeholder { color: var(--text-muted); }
.tb-search kbd {
  font-size: 10px; padding: 1px 5px; border-radius: 3px;
  background: var(--bg-active); color: var(--text-muted); border: 1px solid var(--border);
  font-family: var(--font-ui); white-space: nowrap;
}
.tb-profile {
  display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px;
  border-radius: var(--radius); cursor: pointer; transition: background 0.15s;
}
.tb-profile:hover { background: var(--bg-hover); }
.tb-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #00A080);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 11px; font-weight: 700;
}
.tb-profile-name { font-size: 12.5px; font-weight: 500; color: var(--text-primary); }
.tb-profile-role { font-size: 10.5px; color: var(--text-muted); }

/* ========== TAB BAR ========== */
#tab-bar {
  height: var(--tabbar-h); min-height: var(--tabbar-h);
  display: flex; align-items: stretch; background: var(--bg-primary);
  border-bottom: 1px solid var(--border); overflow: hidden;
  transition: background-color var(--transition), border-color var(--transition);
}
.tabs-scroll { display: flex; align-items: stretch; overflow-x: auto; flex: 1; }
.tabs-scroll::-webkit-scrollbar { height: 0; }
.tab-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 0 14px; border: none; background: transparent;
  color: var(--text-muted); cursor: pointer; white-space: nowrap;
  font-size: 12px; border-right: 1px solid var(--border);
  transition: all 0.15s; position: relative; min-width: 0;
}
.tab-btn:hover { background: var(--bg-hover); color: var(--text-secondary); }
.tab-btn.active {
  background: var(--bg-card); color: var(--text-primary);
  border-bottom: 2px solid var(--accent); margin-bottom: -1px;
}
.tab-btn i { font-size: 11px; }
.tab-btn .tab-close {
  width: 16px; height: 16px; border-radius: 3px; border: none;
  background: transparent; color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; margin-left: 4px; transition: all 0.12s;
}
.tab-btn .tab-close:hover { background: var(--danger); color: #fff; }
.tab-actions {
  display: flex; align-items: center; padding: 0 8px; gap: 2px;
  border-left: 1px solid var(--border);
}
.view-btn {
  padding: 4px 10px; border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-muted); cursor: pointer;
  font-size: 12px; transition: all 0.15s;
}
.view-btn:hover { color: var(--text-secondary); background: var(--bg-hover); }
.view-btn.active { color: var(--accent); background: var(--accent-dim); }

/* ========== CONTENT ========== */
#content { flex: 1; overflow: hidden; position: relative; background: var(--bg-primary); }

/* ========== STATUS BAR ========== */
#status-bar {
  height: var(--statusbar-h); min-height: var(--statusbar-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; font-size: 11px; color: var(--text-muted);
  border-top: 1px solid var(--border); background: var(--bg-secondary);
  transition: background-color var(--transition), border-color var(--transition);
}
.status-left, .status-center, .status-right { display: flex; align-items: center; gap: 16px; }

/* ========== GRID ========== */
.grid-container { height: 100%; display: flex; flex-direction: column; }
.grid-toolbar {
  display: flex; align-items: center; gap: 6px; padding: 8px 12px;
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
  background: var(--bg-card);
}
.g-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-input);
  color: var(--text-secondary); cursor: pointer; font-size: 12px;
  transition: all 0.15s; white-space: nowrap;
}
.g-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-light); }
.g-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.g-btn.primary:hover { background: var(--accent-hover); }
.g-btn.danger { color: var(--danger); }
.g-btn.danger:hover { background: rgba(239,68,68,0.1); }
.g-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.g-search {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0 8px; height: 30px;
  margin-left: auto;
}
.g-search:focus-within { border-color: var(--accent-border); }
.g-search i { color: var(--text-muted); font-size: 11px; }
.g-search input {
  border: none; background: transparent; outline: none; width: 140px;
  color: var(--text-primary); font-size: 12px;
}
.grid-wrap { flex: 1; overflow: auto; position: relative; }
.grid-table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  font-size: 12.5px; table-layout: fixed;
}
.grid-table thead { position: sticky; top: 0; z-index: 10; }
.grid-table th {
  background: var(--bg-elevated); color: var(--text-secondary);
  font-weight: 600; text-align: left; padding: 8px 10px;
  border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
  cursor: pointer; user-select: none; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; position: relative; transition: background 0.12s;
}
.grid-table th:hover { background: var(--bg-hover); color: var(--text-primary); }
.grid-table th.sorted { color: var(--accent); }
.grid-table th .sort-icon { margin-left: 4px; font-size: 10px; opacity: 0.5; }
.grid-table th.sorted .sort-icon { opacity: 1; }
.grid-table th.row-num-header { width: 44px; min-width: 44px; text-align: center; cursor: default; }
.grid-table th.row-num-header:hover { background: var(--bg-elevated); }
.grid-table td {
  padding: 7px 10px; border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; max-width: 0;
  transition: background 0.1s;
}
.grid-table tr:nth-child(even) td { background: var(--grid-row-alt); }
.grid-table tbody tr:hover td { background: var(--grid-row-hover); }
.grid-table tbody tr.selected td { background: var(--grid-row-selected); }
.grid-table td.row-num {
  text-align: center; color: var(--text-muted); font-size: 11px;
  width: 44px; min-width: 44px; background: var(--bg-elevated) !important;
  font-weight: 500;
}
.grid-table td.row-num input[type="checkbox"] {
  accent-color: var(--accent); cursor: pointer;
}
.grid-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 300px; color: var(--text-muted); gap: 12px;
}
.grid-empty i { font-size: 40px; opacity: 0.3; }
.grid-filter-row td {
  padding: 4px 6px; background: var(--bg-secondary) !important;
  border-bottom: 2px solid var(--border);
}
.grid-filter-row input, .grid-filter-row select {
  width: 100%; border: 1px solid var(--border); border-radius: 3px;
  background: var(--bg-input); color: var(--text-primary);
  padding: 3px 6px; font-size: 11.5px; outline: none;
}
.grid-filter-row input:focus, .grid-filter-row select:focus { border-color: var(--accent-border); }

/* ========== CELL BADGES ========== */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
}
.badge-blue { background: rgba(59,130,246,0.15); color: #60A5FA; }
.badge-amber { background: rgba(245,158,11,0.15); color: #FBBF24; }
.badge-green { background: rgba(16,185,129,0.15); color: #34D399; }
.badge-red { background: rgba(239,68,68,0.15); color: #F87171; }
.badge-purple { background: rgba(139,92,246,0.15); color: #A78BFA; }
.badge-gray { background: rgba(107,114,128,0.15); color: #9CA3AF; }
.badge-cyan { background: rgba(6,182,212,0.15); color: #22D3EE; }
.priority-dot {
  display: inline-flex; align-items: center; gap: 5px; font-weight: 500;
}
.priority-dot::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.priority-dot.critical::before { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
.priority-dot.high::before { background: #F97316; }
.priority-dot.medium::before { background: var(--warning); }
.priority-dot.low::before { background: var(--success); }
.pct-cell { display: flex; align-items: center; gap: 8px; }
.pct-bar { width: 60px; height: 6px; background: var(--bg-active); border-radius: 3px; overflow: hidden; }
.pct-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.tag {
  display: inline-block; padding: 1px 7px; border-radius: 4px;
  font-size: 11px; margin: 1px 2px; background: var(--bg-active);
  color: var(--text-secondary); border: 1px solid var(--border);
}
.rating-cell { color: var(--warning); letter-spacing: 1px; font-size: 12px; }
.currency-cell { font-weight: 500; font-variant-numeric: tabular-nums; }
.link-cell { color: var(--accent); cursor: pointer; }
.link-cell:hover { text-decoration: underline; }

/* ========== FORM VIEW ========== */
.form-container { height: 100%; overflow-y: auto; padding: 20px; }
.form-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
}
.form-header h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.form-nav { display: flex; gap: 6px; }
.form-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.form-card-title {
  font-family: var(--font-display); font-size: 14px; font-weight: 600;
  color: var(--accent); margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid.three-col { grid-template-columns: 1fr 1fr 1fr; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
.form-label {
  font-size: 11.5px; font-weight: 600; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.form-input, .form-select, .form-textarea {
  padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-input); color: var(--text-primary); outline: none;
  transition: border-color 0.15s; font-size: 13px;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent-border); }
.form-textarea { min-height: 70px; resize: vertical; }
.form-actions {
  display: flex; gap: 8px; justify-content: flex-end;
  padding-top: 16px; border-top: 1px solid var(--border); margin-top: 8px;
}
.form-readonly { background: var(--bg-hover) !important; opacity: 0.85; }

/* ========== DASHBOARD ========== */
.dash-container { height: 100%; overflow-y: auto; padding: 20px; }
.dash-title {
  font-family: var(--font-display); font-size: 24px; font-weight: 700;
  margin-bottom: 20px;
}
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.kpi-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px;
  box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.kpi-label { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
.kpi-value { font-family: var(--font-display); font-size: 28px; font-weight: 700; margin: 4px 0; }
.kpi-change { font-size: 11.5px; display: flex; align-items: center; gap: 4px; }
.kpi-change.up { color: var(--success); }
.kpi-change.down { color: var(--danger); }
.chart-row { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-bottom: 20px; }
.chart-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px;
  box-shadow: var(--shadow-sm);
}
.chart-card-title { font-family: var(--font-display); font-size: 14px; font-weight: 600; margin-bottom: 14px; }
.chart-card canvas { max-height: 240px; }
.activity-list { list-style: none; }
.activity-item {
  display: flex; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--border); font-size: 12.5px;
}
.activity-item:last-child { border-bottom: none; }
.activity-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
}
.activity-text { flex: 1; color: var(--text-secondary); }
.activity-time { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
.quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick-link {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-radius: var(--radius-sm); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.15s; color: var(--text-secondary); font-size: 12.5px;
}
.quick-link:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-border); }
.quick-link i { width: 20px; text-align: center; }

/* ========== MODALS ========== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  width: 90%; max-width: 640px; max-height: 85vh; display: flex; flex-direction: column;
  transform: scale(0.95) translateY(10px); transition: transform 0.2s;
}
.modal-overlay.show .modal { transform: scale(1) translateY(0); }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.modal-close {
  width: 30px; height: 30px; border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 20px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}

/* ========== SLIDE PANELS ========== */
.slide-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 380px;
  background: var(--bg-card); border-left: 1px solid var(--border);
  z-index: 500; transform: translateX(100%); transition: transform 0.3s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,0.2);
}
.slide-panel.open { transform: translateX(0); }
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px; border-bottom: 1px solid var(--border);
}
.panel-header h3 { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.panel-body { flex: 1; overflow-y: auto; padding: 16px; }

/* ========== AI PANEL ========== */
.ai-messages { display: flex; flex-direction: column; gap: 12px; }
.ai-msg {
  max-width: 90%; padding: 10px 14px; border-radius: var(--radius);
  font-size: 13px; line-height: 1.6;
}
.ai-msg.bot { background: var(--accent-dim); color: var(--text-primary); align-self: flex-start; border-bottom-left-radius: 3px; }
.ai-msg.user { background: var(--bg-active); color: var(--text-primary); align-self: flex-end; border-bottom-right-radius: 3px; }
.ai-input-row {
  display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
}
.ai-input-row input {
  flex: 1; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg-input);
  color: var(--text-primary); outline: none; font-size: 13px;
}
.ai-input-row input:focus { border-color: var(--accent-border); }
.ai-input-row button {
  padding: 8px 14px; border: none; border-radius: var(--radius-sm);
  background: var(--accent); color: #fff; cursor: pointer; font-size: 13px;
  font-weight: 600; transition: background 0.15s;
}
.ai-input-row button:hover { background: var(--accent-hover); }

/* ========== NOTIFICATION PANEL ========== */
.notif-item {
  display: flex; gap: 10px; padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.notif-item:last-child { border-bottom: none; }
.notif-icon {
  width: 34px; height: 34px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0;
}
.notif-text { font-size: 12.5px; color: var(--text-secondary); }
.notif-text strong { color: var(--text-primary); }
.notif-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* ========== TOAST ========== */
#toast-container {
  position: fixed; top: 60px; right: 16px; z-index: 2000;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; border-radius: var(--radius);
  background: var(--bg-elevated); border: 1px solid var(--border);
  box-shadow: var(--shadow); font-size: 13px; color: var(--text-primary);
  animation: toastIn 0.3s ease; min-width: 280px;
}
.toast.out { animation: toastOut 0.3s ease forwards; }
.toast i { font-size: 16px; }
.toast.success i { color: var(--success); }
.toast.error i { color: var(--danger); }
.toast.info i { color: var(--info); }
.toast.warning i { color: var(--warning); }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

/* ========== WELCOME SCREEN ========== */
.welcome {
  height: 100%; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 16px; color: var(--text-muted); padding: 40px;
  text-align: center;
}
.welcome-icon { font-size: 56px; opacity: 0.15; margin-bottom: 8px; }
.welcome h2 { font-family: var(--font-display); font-size: 22px; color: var(--text-primary); font-weight: 600; }
.welcome p { max-width: 400px; font-size: 13.5px; }

/* ========== COLUMN BUILDER ========== */
.col-builder-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius-sm); margin-bottom: 6px;
}
.col-builder-item input, .col-builder-item select {
  padding: 4px 8px; border: 1px solid var(--border); border-radius: 3px;
  background: var(--bg-primary); color: var(--text-primary); font-size: 12px; outline: none;
}
.col-builder-item input:focus, .col-builder-item select:focus { border-color: var(--accent-border); }
.col-builder-item .remove-col {
  width: 24px; height: 24px; border: none; border-radius: 3px;
  background: transparent; color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 11px;
}
.col-builder-item .remove-col:hover { background: rgba(239,68,68,0.15); color: var(--danger); }

/* ========== RESPONSIVE ========== */
@media (max-width: 1024px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .chart-row { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  #sidebar { position: fixed; left: 0; top: 0; z-index: 200; }
  #sidebar.collapsed { transform: translateX(-100%); width: var(--sidebar-w); }
  .kpi-row { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div id="app" data-theme="dark">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">F</div>
      <span class="sidebar-header-title">FMCore ERP</span>

      <button onclick="showNewRegisterModal()" title="New register"><i class="fas fa-plus"></i><span class="sidebar-text">New</span></button>
    </div>
  </aside>

  <!-- MAIN -->
  <div id="main">
    <!-- TOOLBAR -->
    <header id="toolbar">
      <div class="toolbar-left">
        <button class="tb-btn" onclick="toggleSidebar()" title="Toggle sidebar" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>

        <button class="tb-btn" onclick="toggleAI()" title="AI Assistant" id="aiBtn"><i class="fas fa-wand-magic-sparkles"></i></button>

        <span id="statusTime"></span>
        <span>Admin | IT Department</span>

  <!-- MODAL: New Register -->

  <!-- MODAL: Record Form -->

// ========== INITIALIZE REGISTERS ==========
function initRegisters() {
  REGISTER_DEFS.forEach(def => {
    const reg = { ...def, records: def.records.map((r, i) => {
      // Auto-generate auto_increment fields
      const rec = { ...r };
      def.columns.forEach(col => {
        if (col.type === 'auto_increment' && !rec[col.name]) rec[col.name] = i + 1;
      });
      return rec;
    })};
    state.registers[def.id] = reg;
  });
}

// ========== THEME ==========
function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.getElementById('app').setAttribute('data-theme', state.theme);
  document.getElementById('themeBtn').innerHTML = state.theme === 'dark'
    ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
  // Redraw charts with new colors
  const activeTab = state.tabs.find(t => t.id === state.activeTabId);
  if (activeTab && activeTab.type === 'dashboard') renderDashboard();
}

// ========== SIDEBAR ==========
function toggleSidebar() {
  state.sidebarCollapsed = !state.sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', state.sidebarCollapsed);
  document.getElementById('collapseIcon').className = state.sidebarCollapsed ? 'fas fa-angles-right' : 'fas fa-angles-left';
}

function buildSidebarTree() {
  const tree = document.getElementById('sidebarTree');
  // Dashboard
  let html = `<div class="tree-item" data-id="__dashboard" onclick="openDashboard()">
    <span class="tree-icon"><i class="fas fa-gauge-high"></i></span>
    <span class="sidebar-text">Dashboard</span>
  </div>`;
  // Categories
  const sortedCats = Object.entries(CATEGORIES).sort((a,b) => a[1].order - b[1].order);
  sortedCats.forEach(([catId, cat]) => {
    const regs = Object.values(state.registers).filter(r => r.category === catId);
    if (!regs.length) return;
    html += `<div class="tree-item" onclick="toggleTreeGroup(this,'cat-${catId}')">
      <span class="tree-toggle open"><i class="fas fa-chevron-right"></i></span>
      <span class="tree-icon"><i class="fas ${cat.icon}"></i></span>
      <span class="sidebar-text">${cat.name}</span>
      <span class="sidebar-text tree-badge">${regs.length}</span>
    </div>
    <div class="tree-children" id="cat-${catId}">`;
    regs.forEach(reg => {
      html += `<div class="tree-item" data-id="${reg.id}" onclick="openRegister('${reg.id}')" style="padding-left:42px">
        <span class="tree-icon"><i class="fas ${reg.icon}" style="font-size:11px"></i></span>
        <span class="sidebar-text">${reg.name}</span>
      </div>`;
    });
    html += `</div>`;
  });
  // Reports, Settings, Recycle Bin
  html += `<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">
    <div class="tree-item" onclick="showToast('Reports module coming soon','info')">
      <span class="tree-icon"><i class="fas fa-chart-bar"></i></span><span class="sidebar-text">Reports</span>
    </div>
    <div class="tree-item" onclick="showToast('Settings module coming soon','info')">
      <span class="tree-icon"><i class="fas fa-cog"></i></span><span class="sidebar-text">Settings</span>
    </div>
    <div class="tree-item" onclick="showToast('Recycle Bin is empty','info')">
      <span class="tree-icon"><i class="fas fa-trash-can"></i></span><span class="sidebar-text">Recycle Bin</span>
    </div>
  </div>`;
  tree.innerHTML = html;
}

function toggleTreeGroup(el, groupId) {
  const children = document.getElementById(groupId);
  const toggle = el.querySelector('.tree-toggle');
  children.classList.toggle('hidden');
  toggle.classList.toggle('open');
}

function highlightSidebarItem(id) {
  document.querySelectorAll('.tree-item').forEach(i => i.classList.remove('active'));
  const item = document.querySelector(`.tree-item[data-id="${id}"]`);
  if (item) item.classList.add('active');
}

// Sidebar search
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sidebarSearch').addEventListener('input', function() {
    const q = this.value.toLowerCase();
    document.querySelectorAll('.tree-item[data-id]').forEach(item => {
      const text = item.textContent.toLowerCase();
      const regId = item.getAttribute('data-id');
      if (regId && regId.startsWith('__')) return;
      item.style.display = !q || text.includes(q) ? '' : 'none';
    });
    // Show all groups if searching
    if (q) {
      document.querySelectorAll('.tree-children').forEach(c => c.classList.remove('hidden'));
      document.querySelectorAll('.tree-toggle').forEach(t => t.classList.add('open'));
    }
  });
});

// ========== TABS ==========
function openTab(id, name, icon, type, regId) {
  const existing = state.tabs.find(t => t.id === id);
  if (existing) {
    activateTab(id);
    return;
  }
  state.tabs.push({ id, name, icon, type, regId });
  renderTabs();
  activateTab(id);
}

function activateTab(id) {
  state.activeTabId = id;
  state.selectedRows.clear();
  state.sortCol = -1;
  state.filters = {};
  renderTabs();
  const tab = state.tabs.find(t => t.id === id);
  if (!tab) return;
  highlightSidebarItem(tab.type === 'dashboard' ? '__dashboard' : tab.regId);
  document.getElementById('tabActions').style.display = tab.type === 'register' ? '' : 'none';
  if (tab.type === 'dashboard') {
    renderDashboard();
    setBreadcrumb('Dashboard');
    updateStatus('Dashboard loaded', '');
  } else if (tab.type === 'register') {
    state.currentView = 'grid';
    updateViewButtons();
    renderGrid(tab.regId);
    const reg = state.registers[tab.regId];
    setBreadcrumb(`Registers > ${reg.name}`);
    updateStatus(`${reg.name} — ${reg.records.length} records`, '');
  }
}

function closeTab(id, e) {
  if (e) e.stopPropagation();
  state.tabs = state.tabs.filter(t => t.id !== id);
  if (state.activeTabId === id) {
    if (state.tabs.length) {
      activateTab(state.tabs[state.tabs.length - 1].id);
    } else {
      state.activeTabId = null;
      document.getElementById('tabActions').style.display = 'none';
      renderWelcome();
      highlightSidebarItem('');
      setBreadcrumb('');
      updateStatus('Ready', '');
    }
  }
  renderTabs();
}

function renderTabs() {
  const scroll = document.getElementById('tabsScroll');
  scroll.innerHTML = state.tabs.map(t => `
    <button class="tab-btn ${t.id === state.activeTabId ? 'active' : ''}" onclick="activateTab('${t.id}')">
      <i class="fas ${t.icon}"></i>
      <span>${t.name}</span>
      <button class="tab-close" onclick="closeTab('${t.id}',event)" aria-label="Close tab"><i class="fas fa-xmark"></i></button>
    </button>
  `).join('');
}

function switchView(view) {
  state.currentView = view;
  updateViewButtons();
  const tab = state.tabs.find(t => t.id === state.activeTabId);
  if (tab && tab.type === 'register') {
    if (view === 'grid') renderGrid(tab.regId);
    else renderFormView(tab.regId);
  }
}

function updateViewButtons() {
  document.querySelectorAll('.view-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === state.currentView);
  });
}

// ========== GRID RENDERER ==========
function renderGrid(regId) {
  const reg = state.registers[regId];
  if (!reg) return;
  const content = document.getElementById('content');
  // Get filtered/sorted records
  let records = getProcessedRecords(regId);
  // Build filter row
  const filterRow = reg.columns.map(col => {
    if (col.type === 'auto_increment') return `<td></td>`;
    if (col.type === 'status' || col.type === 'priority' || col.type === 'dropdown') {
      const opts = col.options || [];
      return `<td><select onchange="setFilter('${regId}','${col.name}',this.value)">
        <option value="">All</option>${opts.map(o => `<option value="${o}" ${state.filters[col.name]===o?'selected':''}>${o}</option>`).join('')}
      </select></td>`;
    }
    return `<td><input type="text" placeholder="Filter..." value="${state.filters[col.name]||''}" oninput="setFilter('${regId}','${col.name}',this.value)"></td>`;
  }).join('');

  content.innerHTML = `<div class="grid-container">
    <div class="grid-toolbar">
      <button class="g-btn primary" onclick="addRecord('${regId}')"><i class="fas fa-plus"></i> Add Record</button>
      <button class="g-btn" onclick="editSelectedRecord('${regId}')" id="editBtn" disabled><i class="fas fa-pen"></i> Edit</button>
      <button class="g-btn danger" onclick="deleteSelectedRecords('${regId}')" id="deleteBtn" disabled><i class="fas fa-trash"></i> Delete</button>
      <span class="g-sep"></span>
      <button class="g-btn" onclick="exportCSV('${regId}')"><i class="fas fa-file-csv"></i> CSV</button>
      <button class="g-btn" onclick="showToast('PDF export generated','success')"><i class="fas fa-file-pdf"></i> PDF</button>
      <button class="g-btn" onclick="showToast('Excel export generated','success')"><i class="fas fa-file-excel"></i> Excel</button>
      <span class="g-sep"></span>
      <button class="g-btn" onclick="toggleFilters('${regId}')"><i class="fas fa-filter"></i> Filters</button>
      <div class="g-search">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Quick search..." oninput="quickSearch('${regId}',this.value)" id="quickSearch_${regId}">
      </div>
    </div>
    <div class="grid-wrap" id="gridWrap_${regId}">
      <table class="grid-table" id="gridTable_${regId}">
        <thead>
          <tr>
            <th class="row-num-header"><input type="checkbox" onchange="toggleSelectAll('${regId}',this.checked)" aria-label="Select all"></th>
            ${reg.columns.map((col, i) => {
              const sorted = state.sortCol === i;
              const icon = sorted ? (state.sortDir === 'asc' ? 'fa-sort-up' : 'fa-sort-down') : 'fa-sort';
              return `<th style="width:${col.width}px" class="${sorted?'sorted':''}" onclick="sortGrid('${regId}',${i})">${col.name} <i class="fas ${icon} sort-icon"></i></th>`;
            }).join('')}
          </tr>
          <tr class="grid-filter-row" id="filterRow_${regId}" style="display:none">
            <td></td>${filterRow}
          </tr>
        </thead>
        <tbody>
          ${records.length ? records.map((rec, ri) => {
            const origIdx = reg.records.indexOf(rec);
            const selected = state.selectedRows.has(origIdx);
            return `<tr class="${selected?'selected':''}" ondblclick="viewRecord('${regId}',${origIdx})" onclick="selectRow('${regId}',${origIdx},event)">
              <td class="row-num"><input type="checkbox" ${selected?'checked':''} onclick="event.stopPropagation();selectRow('${regId}',${origIdx},null)" aria-label="Select row">${ri+1}</td>
              ${reg.columns.map(col => `<td>${renderCell(rec[col.name], col)}</td>`).join('')}
            </tr>`;
          }).join('') : `<tr><td colspan="${reg.columns.length+1}" class="grid-empty" style="padding:60px"><i class="fas fa-inbox"></i><div>No records found</div><div style="font-size:12px">Click "Add Record" to create a new entry</div></td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
  updateSelectionButtons();
  updateStatus(`${reg.name} — ${records.length} of ${reg.records.length} records`, '');
}

function renderCell(value, col) {
  if (value == null || value === '') return '<span style="color:var(--text-muted)">—</span>';
  switch (col.type) {
    case 'status': {
      const c = STATUS_COLORS[value] || 'gray';
      return `<span class="badge badge-${c}">${value}</span>`;
    }
    case 'priority': {
      const cls = PRIORITY_CLASSES[value] || 'low';
      return `<span class="priority-dot ${cls}">${value}</span>`;
    }
    case 'checkbox':
      return `<input type="checkbox" ${value?'checked':''} disabled style="accent-color:var(--accent)">`;
    case 'currency':
      return `<span class="currency-cell">${Number(value).toLocaleString('en-AE', {style:'currency',currency:'AED',minimumFractionDigits:0})}</span>`;
    case 'percentage': {
      const v = Number(value) || 0;
      const color = v >= 80 ? 'var(--success)' : v >= 50 ? 'var(--warning)' : 'var(--danger)';
      return `<div class="pct-cell"><div class="pct-bar"><div class="pct-fill" style="width:${v}%;background:${color}"></div></div><span>${v}%</span></div>`;
    }
    case 'rating': {
      let s = '';
      for (let i = 1; i <= 5; i++) s += `<i class="fa${i <= value ? 's' : 'r'} fa-star"></i>`;
      return `<span class="rating-cell">${s}</span>`;
    }
    case 'date':
      return value ? new Date(value).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}) : '';
    case 'time':
      return value || '';
    case 'datetime':
      return value ? new Date(value).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    case 'email':
      return `<span class="link-cell">${value}</span>`;
    case 'phone':
      return `<span style="color:var(--text-secondary)"><i class="fas fa-phone" style="font-size:10px;margin-right:4px;color:var(--text-muted)"></i>${value}</span>`;
    case 'multi_select':
      return (Array.isArray(value) ? value : [value]).map(v => `<span class="tag">${v}</span>`).join('');
    case 'long_text':
      return `<span title="${String(value).replace(/"/g,'&quot;')}">${String(value).substring(0,50)}${String(value).length>50?'...':''}</span>`;
    case 'number':
      return typeof value === 'number' ? value.toLocaleString() : value;
    case 'auto_increment':
      return `<span style="color:var(--text-muted);font-weight:500">#${value}</span>`;
    default:
      return String(value);
  }
}

function getProcessedRecords(regId) {
  const reg = state.registers[regId];
  let records = [...reg.records];
  // Apply filters
  const q = document.getElementById('quickSearch_'+regId);
  const quickQ = q ? q.value.toLowerCase() : '';
  Object.entries(state.filters).forEach(([colName, val]) => {
    if (!val) return;
    const lv = val.toLowerCase();
    records = records.filter(r => {
      const rv = r[colName];
      if (Array.isArray(rv)) return rv.some(v => String(v).toLowerCase().includes(lv));
      return String(rv ?? '').toLowerCase().includes(lv);
    });
  });
  if (quickQ) {
    records = records.filter(r => Object.values(r).some(v => {
      if (Array.isArray(v)) return v.some(x => String(x).toLowerCase().includes(quickQ));
      return String(v ?? '').toLowerCase().includes(quickQ);
    }));
  }
  // Apply sort
  if (state.sortCol >= 0) {
    const col = reg.columns[state.sortCol];
    records.sort((a, b) => {
      let va = a[col.name], vb = b[col.name];
      if (va == null) va = '';
      if (vb == null) vb = '';
      if (col.type === 'number' || col.type === 'currency' || col.type === 'percentage' || col.type === 'auto_increment') {
        return (Number(va) || 0) - (Number(vb) || 0);
      }
      if (col.type === 'date' || col.type === 'datetime') {
        return new Date(va || 0) - new Date(vb || 0);
      }
      return String(va).localeCompare(String(vb));
    });
    if (state.sortDir === 'desc') records.reverse();
  }
  return records;
}

function sortGrid(regId, colIdx) {
  if (state.sortCol === colIdx) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortCol = colIdx;
    state.sortDir = 'asc';
  }
  renderGrid(regId);
}

function setFilter(regId, colName, value) {
  if (value) state.filters[colName] = value;
  else delete state.filters[colName];
  renderGrid(regId);
}

function toggleFilters(regId) {
  const row = document.getElementById('filterRow_'+regId);
  row.style.display = row.style.display === 'none' ? '' : 'none';
}

function quickSearch(regId, value) {
  renderGrid(regId);
  // Restore focus
  const el = document.getElementById('quickSearch_'+regId);
  if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
}

function selectRow(regId, idx, event) {
  if (event && event.target.tagName === 'INPUT') return;
  if (state.selectedRows.has(idx)) state.selectedRows.delete(idx);
  else state.selectedRows.add(idx);
  renderGrid(regId);
}

function toggleSelectAll(regId, checked) {
  const reg = state.registers[regId];
  const records = getProcessedRecords(regId);
  if (checked) {
    records.forEach(r => state.selectedRows.add(reg.records.indexOf(r)));
  } else {
    state.selectedRows.clear();
  }
  renderGrid(regId);
}

function updateSelectionButtons() {
  const editBtn = document.getElementById('editBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  if (editBtn) editBtn.disabled = state.selectedRows.size !== 1;
  if (deleteBtn) deleteBtn.disabled = state.selectedRows.size === 0;
}

// ========== FORM RENDERER ==========
function renderFormView(regId) {
  const reg = state.registers[regId];
  const content = document.getElementById('content');
  if (!reg.records.length) {
    content.innerHTML = `<div class="form-container"><div class="grid-empty" style="height:400px"><i class="fas fa-inbox"></i><div>No records to display</div></div></div>`;
    return;
  }
  if (state.currentRecordIdx < 0 || state.currentRecordIdx >= reg.records.length) state.currentRecordIdx = 0;
  const rec = reg.records[state.currentRecordIdx];
  const autoFields = ['auto_increment'];
  // Group fields into sections
  const sections = [{title:'General Information', cols: reg.columns.filter(c => !['long_text','remarks'].includes(c.name.toLowerCase()))},
    {title:'Details', cols: reg.columns.filter(c => c.type === 'long_text' || c.name.toLowerCase().includes('remarks') || c.name.toLowerCase().includes('description') || c.name.toLowerCase().includes('findings') || c.name.toLowerCase().includes('discussion') || c.name.toLowerCase().includes('action'))}];

  content.innerHTML = `<div class="form-container">
    <div class="form-header">
      <h2>${reg.name} — Record #${state.currentRecordIdx + 1}</h2>
      <div class="form-nav">
        <button class="g-btn" onclick="navRecord('${regId}',-1)" ${state.currentRecordIdx<=0?'disabled':''}><i class="fas fa-chevron-left"></i> Previous</button>
        <span style="padding:0 12px;color:var(--text-muted);font-size:12px">${state.currentRecordIdx+1} / ${reg.records.length}</span>
        <button class="g-btn" onclick="navRecord('${regId}',1)" ${state.currentRecordIdx>=reg.records.length-1?'disabled':''}>Next <i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
    ${sections.filter(s => s.cols.length).map(sec => `
      <div class="form-card">
        <div class="form-card-title"><i class="fas fa-layer-group"></i> ${sec.title}</div>
        <div class="form-grid ${sec.cols.length > 4 ? 'three-col' : ''}">
          ${sec.cols.map(col => {
            if (autoFields.includes(col.type)) return `<div class="form-group"><label class="form-label">${col.name}</label><div style="padding:8px 10px;background:var(--bg-hover);border-radius:var(--radius-sm);color:var(--text-muted);font-weight:500">#${rec[col.name]}</div></div>`;
            return `<div class="form-group ${col.type==='long_text'?'full':''}"><label class="form-label">${col.name}</label>${renderFormField(col, rec[col.name], true)}</div>`;
          }).join('')}
        </div>
      </div>
    `).join('')}
    <div class="form-actions">
      <button class="g-btn" onclick="editSelectedRecordById('${regId}',${state.currentRecordIdx})"><i class="fas fa-pen"></i> Edit</button>
      <button class="g-btn" onclick="switchView('grid')"><i class="fas fa-table-cells"></i> Back to Grid</button>
    </div>
  </div>`;
}

function renderFormField(col, value, readonly) {
  const ro = readonly ? 'readonly class="form-input form-readonly"' : 'class="form-input"';
  const roSel = readonly ? 'disabled class="form-select form-readonly"' : 'class="form-select"';
  switch (col.type) {
    case 'long_text': return `<textarea ${ro} rows="3">${value||''}</textarea>`;
    case 'number': return `<input type="number" ${ro} value="${value??''}">`;
    case 'currency': return `<input type="number" step="0.01" ${ro} value="${value??''}">`;
    case 'percentage': return `<input type="number" min="0" max="100" ${ro} value="${value??0}">`;
    case 'date': return `<input type="date" ${ro} value="${value||''}">`;
    case 'time': return `<input type="time" ${ro} value="${value||''}">`;
    case 'datetime': return `<input type="datetime-local" ${ro} value="${value||''}">`;
    case 'checkbox': return `<input type="checkbox" ${readonly?'disabled':''} ${value?'checked':''} style="accent-color:var(--accent);margin-top:8px">`;
    case 'dropdown': case 'status': case 'priority':
      return `<select ${roSel}>${(col.options||[]).map(o => `<option value="${o}" ${value===o?'selected':''}>${o}</option>`).join('')}</select>`;
    case 'multi_select':
      return `<div style="display:flex;flex-wrap:wrap;gap:4px">${(Array.isArray(value)?value:[value]).filter(Boolean).map(v=>`<span class="tag">${v}</span>`).join('')}</div>`;
    case 'email': return `<input type="email" ${ro} value="${value||''}">`;
    case 'phone': return `<input type="tel" ${ro} value="${value||''}">`;
    case 'rating':
      let s='';for(let i=1;i<=5;i++)s+=`<i class="fa${i<=(value||0)?'s':'r'} fa-star" style="color:var(--warning);font-size:16px"></i>`;
      return `<div>${s}</div>`;
    default: return `<input type="text" ${ro} value="${value??''}">`;
  }
}

function openRecordModal(regId, idx) {
  const reg = state.registers[regId];
  const isEdit = idx >= 0;
  const rec = isEdit ? { ...reg.records[idx] } : {};
  document.getElementById('recordModalTitle').textContent = isEdit ? `Edit Record — ${reg.name}` : `Add Record — ${reg.name}`;
  const editableCols = reg.columns.filter(c => c.type !== 'auto_increment');
  // Group into sections
  const basic = editableCols.filter(c => !['long_text'].includes(c.type) && !c.name.toLowerCase().match(/remarks|description|findings|discussion|action|measures|recommendations|points/));
  const detail = editableCols.filter(c => ['long_text'].includes(c.type) || c.name.toLowerCase().match(/remarks|description|findings|discussion|action|measures|recommendations|points/));

  document.getElementById('recordModalBody').innerHTML = `

    <div class="form-grid ${basic.length > 6 ? 'three-col' : ''}">
      ${basic.map(col => `<div class="form-group"><label class="form-label">${col.name}</label>${renderFormField(col, rec[col.name], false)}</div>`).join('')}
    </div></div>` : ''}
    ${detail.length ? `<div class="form-card"><div class="form-card-title"><i class="fas fa-align-left"></i> Additional Information</div>
    <div class="form-grid">
      ${detail.map(col => `<div class="form-group full"><label class="form-label">${col.name}</label>${renderFormField(col, rec[col.name], false)}</div>`).join('')}
    </div></div>` : ''}
  `;
  document.getElementById('recordModalFooter').innerHTML = `
    <button class="g-btn" onclick="closeModal('recordModal')">Cancel</button>
    <button class="g-btn primary" onclick="saveRecord('${regId}',${idx})"><i class="fas fa-check"></i> ${isEdit?'Update':'Create'}</button>
  `;
  openModal('recordModal');
}

function saveRecord(regId, idx) {
  const reg = state.registers[regId];
  const rec = idx >= 0 ? { ...reg.records[idx] } : {};
  // Auto-increment
  if (idx < 0) {
    reg.columns.forEach(col => {
      if (col.type === 'auto_increment') rec[col.name] = reg.records.length + 1;
    });
  }
  // Collect values from form
  reg.columns.forEach(col => {
    if (col.type === 'auto_increment') return;
    const label = document.querySelector(`.form-label`);
    // Find input by label text
    const labels = document.querySelectorAll('#recordModalBody .form-label');
    labels.forEach(lbl => {
      if (lbl.textContent.trim() === col.name) {
        const input = lbl.nextElementSibling;
        if (!input) return;
        if (col.type === 'checkbox') { rec[col.name] = input.checked; }
        else if (col.type === 'multi_select') { /* skip for now */ }
        else if (col.type === 'rating') { /* skip */ }
        else { rec[col.name] = input.value || (col.type === 'number' || col.type === 'currency' || col.type === 'percentage' ? 0 : ''); }
      }
    });
  });
  if (idx >= 0) { reg.records[idx] = rec; }
  else { reg.records.push(rec); }
  closeModal('recordModal');
  showToast(idx >= 0 ? 'Record updated successfully' : 'Record created successfully', 'success');
  if (state.currentView === 'grid') renderGrid(regId);
  else renderFormView(regId);
}

function deleteSelectedRecords(regId) {
  if (!state.selectedRows.size) return;
  const reg = state.registers[regId];
  const count = state.selectedRows.size;
  // Remove records (from highest index to lowest to preserve indices)
  [...state.selectedRows].sort((a,b) => b - a).forEach(idx => reg.records.splice(idx, 1));
  state.selectedRows.clear();
  showToast(`${count} record(s) deleted`, 'warning');
  renderGrid(regId);
}

// ========== EXPORT ==========
function exportCSV(regId) {
  const reg = state.registers[regId];
  const headers = reg.columns.map(c => c.name).join(',');
  const rows = reg.records.map(r => reg.columns.map(c => {
    let v = r[c.name];
    if (Array.isArray(v)) v = v.join('; ');
    return `"${String(v ?? '').replace(/"/g, '""')}"`;
  }).join(','));
  const csv = [headers, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${reg.name.replace(/\s+/g,'_')}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast('CSV exported successfully', 'success');
}

function createNewRegister() {
  const name = document.getElementById('newRegName').value.trim();
  if (!name) { showToast('Please enter a register name', 'error'); return; }
  const cat = document.getElementById('newRegCat').value;
  const icon = document.getElementById('newRegIcon').value;
  const color = document.getElementById('newRegColor').value;
  const colItems = document.querySelectorAll('.col-builder-item');
  if (!colItems.length) { showToast('Please add at least one column', 'error'); return; }
  const columns = [];
  colItems.forEach(item => {
    const cName = item.querySelector('[data-field="name"]').value.trim();
    const cType = item.querySelector('[data-field="type"]').value;
    const cWidth = parseInt(item.querySelector('[data-field="width"]').value) || 140;

    const col = { name: cName, type: cType, width: cWidth, options: null };

    if (cType === 'priority') col.options = ['Critical','High','Medium','Low'];
    columns.push(col);
  });
  const id = 'custom_' + Date.now();
  state.registers[id] = { id, name, icon, category: cat, columns, records: [] };

// ========== AI ASSISTANT ==========
function toggleAI() {
  const panel = document.getElementById('aiPanel');
  panel.classList.toggle('open');
  document.getElementById('aiBtn').classList.toggle('active', panel.classList.contains('open'));
}

function sendAI() {
  const input = document.getElementById('aiInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addAIMessage(msg, 'user');
  // Process
  setTimeout(() => {
    const response = processAI(msg);
    addAIMessage(response, 'bot');
  }, 600 + Math.random() * 800);
}

function addAIMessage(text, type) {
  const container = document.getElementById('aiMessages');
  const div = document.createElement('div');
  div.className = `ai-msg ${type}`;
  div.textContent = text;
  container.appendChild(div);
  container.parentElement.scrollTop = container.parentElement.scrollHeight;
}

function processAI(msg) {
  const lower = msg.toLowerCase();
  // Create register
  if (lower.includes('create') && (lower.includes('register') || lower.includes('form') || lower.includes('table'))) {
    const nameMatch = msg.match(/(?:called|named|for)\s+"?([^"]+)"?/i) || msg.match(/create\s+(?:a\s+)?(?:register|form|table)\s+(?:for\s+)?(.+)/i);
    const name = nameMatch ? nameMatch[1].trim().replace(/^for\s+/i,'') : 'Custom Register';
    // Suggest fields based on name
    const fields = suggestFields(name);
    const id = 'ai_' + Date.now();
    state.registers[id] = { id, name, icon: 'fa-table', category: 'operations', columns: fields, records: [] };
    buildSidebarTree();
    setTimeout(() => openRegister(id), 300);
    return `I've created the "${name}" register with ${fields.length} suggested fields. It's now open in a new tab. You can add more columns, adjust types, and start adding records.`;
  }
  if (lower.includes('dashboard') || lower.includes('chart') || lower.includes('kpi')) {
    setTimeout(() => openDashboard(), 300);
    return 'I\'ve opened the Operations Dashboard with KPIs, charts, and recent activities. You can customize widgets and add more metrics.';
  }
  if (lower.includes('work order') || lower.includes('wo')) {
    openRegister('workorders');
    return 'Opened the Maintenance Work Orders register. You currently have 3 work orders — 1 open, 1 in progress, and 1 completed.';
  }
  if (lower.includes('safety') || lower.includes('inspection')) {
    openRegister('safety_insp');
    return 'Opened the Safety Inspection register. There are 3 recent inspections with varying risk levels.';
  }
  if (lower.includes('asset') || lower.includes('equipment')) {
    openRegister('assets');
    return 'Opened the Asset Register. You have 3 tracked assets across HVAC, Elevator, and Fire Protection categories.';
  }
  if (lower.includes('help') || lower.includes('what can')) {
    return 'I can help you with: Creating new registers from descriptions, opening specific registers, generating dashboards, suggesting field types for forms, and providing system guidance. Try saying "Create a register for vehicle inspection" or "Show me the dashboard".';
  }
  return 'I understand your request. Try being more specific — for example: "Create a register for vehicle inspection logs" or "Open the work orders register" or "Show me the dashboard".';
}

function suggestFields(name) {
  const n = name.toLowerCase();
  const fields = [{name:'ID',type:'auto_increment',width:60}];
  if (n.includes('vehicle') || n.includes('car') || n.includes('fleet')) {
    fields.push(
      {name:'Date',type:'date',width:100},{name:'Vehicle',type:'text',width:130},{name:'Driver',type:'employee',width:120},
      {name:'Odometer',type:'number',width:90},{name:'Fuel Level',type:'percentage',width:80},
      {name:'Condition',type:'dropdown',width:100,options:['Excellent','Good','Fair','Poor']},
      {name:'Issues Found',type:'long_text',width:200},{name:'Status',type:'status',width:100,options:['Pass','Fail','Needs Attention']}
    );
  } else if (n.includes('inspection') || n.includes('audit')) {
    fields.push(
      {name:'Date',type:'date',width:100},{name:'Area',type:'text',width:130},{name:'Inspector',type:'employee',width:120},
      {name:'Type',type:'dropdown',width:100,options:['Routine','Scheduled','Surprise']},
      {name:'Findings',type:'long_text',width:200},{name:'Risk Level',type:'priority',width:90},
      {name:'Action Required',type:'long_text',width:180},{name:'Status',type:'status',width:100,options:['Open','In Progress','Closed']}
    );
  } else if (n.includes('log') || n.includes('logbook') || n.includes('diary')) {
    fields.push(
      {name:'Date',type:'date',width:100},{name:'Time',type:'time',width:70},{name:'Equipment',type:'text',width:130},
      {name:'Reading',type:'number',width:90},{name:'Status',type:'dropdown',width:100,options:['Normal','Abnormal','Warning']},
      {name:'Operator',type:'employee',width:120},{name:'Remarks',type:'text',width:160}
    );
  } else {
    fields.push(
      {name:'Date',type:'date',width:100},{name:'Title',type:'text',width:180},{name:'Department',type:'department',width:110},
      {name:'Assigned To',type:'employee',width:120},{name:'Priority',type:'priority',width:90},
      {name:'Description',type:'long_text',width:200},{name:'Status',type:'status',width:100,options:['Open','In Progress','Completed','Closed']},
      {name:'Remarks',type:'text',width:140}
    );
  }
  return fields;
}

// ========== NOTIFICATIONS ==========
function toggleNotifications() {
  const panel = document.getElementById('notifPanel');
  panel.classList.toggle('open');
  document.getElementById('notifBtn').classList.toggle('active', panel.classList.contains('open'));
}

function renderNotifications() {
  const list = document.getElementById('notifList');
  const notifs = [
    { icon:'fa-wrench', color:'var(--warning)', text:'<strong>WO-002</strong> is overdue — Elevator door fault in Building B', time:'30 min ago' },
    { icon:'fa-shield-halved', color:'var(--danger)', text:'Calibration <strong>TC-07</strong> is overdue since Feb 10', time:'2 hours ago' },
    { icon:'fa-check-circle', color:'var(--success)', text:'<strong>Priya Sharma</strong> completed CM-002 — FCU-12 repair', time:'4 hours ago' },
    { icon:'fa-file-signature', color:'var(--info)', text:'Permit To Work <strong>PTW-002</strong> submitted for approval', time:'5 hours ago' },
    { icon:'fa-calendar-minus', color:'var(--warning)', text:'Leave request from <strong>Omar Saeed</strong> pending approval', time:'6 hours ago' },
    { icon:'fa-boxes-stacked', color:'var(--danger)', text:'Inventory alert: <strong>Fire Extinguishers</strong> below minimum level', time:'8 hours ago' },
    { icon:'fa-graduation-cap', color:'var(--accent)', text:'Training <strong>NEBOSH IGC</strong> certificate pending for Fatima Al-Rashid', time:'1 day ago' },
  ];
  list.innerHTML = notifs.map(n => `
    <div class="notif-item">
      <div class="notif-icon" style="background:${n.color}20;color:${n.color}"><i class="fas ${n.icon}"></i></div>
      <div><div class="notif-text">${n.text}</div><div class="notif-time">${n.time}</div></div>
    </div>
  `).join('');
}

// ========== MODALS ==========
function openModal(id) {
  document.getElementById(id).classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
// Close modal on overlay click
document.addEventListener('click', e => {
  if (e.target.classList.contains('modal-overlay') && e.target.classList.contains('show')) {
    e.target.classList.remove('show');
  }
});

// ========== TOAST ==========
function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const icons = { success:'fa-check-circle', error:'fa-times-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i class="fas ${icons[type]||icons.info}"></i><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => { toast.classList.add('out'); setTimeout(() => toast.remove(), 300); }, 3500);
}

// ========== BREADCRUMB & STATUS ==========
function setBreadcrumb(text) {
  document.getElementById('breadcrumb').textContent = text;
}
function updateStatus(msg, center) {
  document.getElementById('statusMsg').textContent = msg;
  document.getElementById('statusCenter').textContent = center;
}

// ========== GLOBAL SEARCH ==========
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('globalSearch').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const q = this.value.trim().toLowerCase();
      if (!q) return;
      // Search across all registers
      for (const [id, reg] of Object.entries(state.registers)) {
        if (reg.name.toLowerCase().includes(q)) {
          openRegister(id);
          this.value = '';
          return;
        }
        const found = reg.records.some(r => Object.values(r).some(v => {
          if (Array.isArray(v)) return v.some(x => String(x).toLowerCase().includes(q));
          return String(v ?? '').toLowerCase().includes(q);
        }));
        if (found) {
          openRegister(id);
          setTimeout(() => {
            const qs = document.getElementById('quickSearch_'+id);
            if (qs) { qs.value = q; quickSearch(id, q); }
          }, 100);
          this.value = '';
          return;
        }
      }
      showToast(`No results found for "${this.value}"`, 'warning');
    }
  });
  // Ctrl+K shortcut
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('globalSearch').focus();
    }
    if (e.key === 'Escape') {
      document.querySelectorAll('.slide-panel.open').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
      document.getElementById('aiBtn').classList.remove('active');
      document.getElementById('notifBtn').classList.remove('active');
    }
  });
});

// ========== CLOCK ==========
function updateClock() {
  const now = new Date();
  document.getElementById('statusTime').textContent = now.toLocaleString('en-GB', { day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit' });
}
setInterval(updateClock, 1000);

// ========== INITIALIZATION ==========
function init() {
  initRegisters();
  buildSidebarTree();
  renderNotifications();
  renderWelcome();
  updateClock();
  // Open dashboard by default
  openDashboard();
}

init();
</script>
